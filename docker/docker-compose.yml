services:
  agile-agent-server:
    image: ${DOCKER_REGISTRY_URL}/agile-agent-server:${IMAGE_TAG}
    container_name: agile-agent-server
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - APP_DATA_DIR=/data
      - DEBUG=${DEBUG:-false}
      - SPRING_PROFILES_ACTIVE
      - NACOS_SERVER_ADDR
    volumes:
      - agile-agent-data:/data

volumes:
  agile-agent-data:
    external: true
