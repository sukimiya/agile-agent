spring:
  application:
    name: agile-agent-server
  cloud:
    nacos:
      config:
        import-check:
          enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/vendor/{vendor}
    baselineOnMigrate: true
    baselineVersion: 0
    table: l7_skill_flyway_schema_history
    cleanDisabled: true

server:
  port: 8088

llm:
  provider-preset:
    allow-http: false
  config:
    secret: ${LLM_CONFIG_SECRET:}
  client-cache:
    ttl: ${LLM_CLIENT_CACHE_TTL:5m}

oauth2:
  authorization-uri: ${OAUTH2_AUTHORIZATION_URI:http://CHANGE_ME/oauth2/authorize}
  token-uri: ${OAUTH2_TOKEN_URI:http://CHANGE_ME/oauth2/token}
  user-info-uri: ${OAUTH2_USERINFO_URI:http://CHANGE_ME/oauth2/userinfo}
  revocation-uri: ${OAUTH2_REVOCATION_URI:}
  client-id: ${OAUTH2_CLIENT_ID:}
  client-secret: ${OAUTH2_CLIENT_SECRET:}
  redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:8088/api/auth/oauth2/callback}
  scope: ${OAUTH2_SCOPE:openid profile offline_access}
  user-type-claim: ${OAUTH2_USER_TYPE_CLAIM:}
  frontend-redirect-uri: ${OAUTH2_FRONTEND_REDIRECT_URI:http://localhost:5173/login/callback}
  # Access-token lifetime when the token response has no expires_in (GitHub OAuth Apps).
  default-access-token-ttl: ${OAUTH2_DEFAULT_ACCESS_TOKEN_TTL:1h}
  # Sent on token, userinfo, and revocation requests; GitHub's API rejects requests without one.
  user-agent: ${OAUTH2_USER_AGENT:agile-agent}
  claims:
    subject: ${OAUTH2_CLAIM_SUBJECT:/sub}
    subject-prefix: ${OAUTH2_CLAIM_SUBJECT_PREFIX:}
    display-name: ${OAUTH2_CLAIM_DISPLAY_NAME:/name}
    display-name-fallback: ${OAUTH2_CLAIM_DISPLAY_NAME_FALLBACK:}
    tenant-id: ${OAUTH2_CLAIM_TENANT_ID:/tenant_id}
    tenant-name: ${OAUTH2_CLAIM_TENANT_NAME:/tenant_name}
    primary-org-id: ${OAUTH2_CLAIM_PRIMARY_ORG_ID:/primary_org/id}
    primary-org-name: ${OAUTH2_CLAIM_PRIMARY_ORG_NAME:/primary_org/name}
    roles: ${OAUTH2_CLAIM_ROLES:/roles}
    manageable-org-ids: ${OAUTH2_CLAIM_MANAGEABLE_ORG_IDS:/manageable_org_ids}
    readable-org-ids: ${OAUTH2_CLAIM_READABLE_ORG_IDS:/readable_org_ids}
  roles:
    platform-admin: ${OAUTH2_PLATFORM_ADMIN_ROLE:platform_admin}
    tenant-admin: ${OAUTH2_TENANT_ADMIN_ROLE:tenant_admin}
  # Used only when enabled and the userinfo lacks the claim (providers without tenant/role/org data).
  claim-defaults:
    enabled: ${OAUTH2_CLAIM_DEFAULTS_ENABLED:false}
    tenant-id: ${OAUTH2_DEFAULT_TENANT_ID:}
    tenant-name: ${OAUTH2_DEFAULT_TENANT_NAME:}
    primary-org-id: ${OAUTH2_DEFAULT_PRIMARY_ORG_ID:}
    primary-org-name: ${OAUTH2_DEFAULT_PRIMARY_ORG_NAME:}
    roles: ${OAUTH2_DEFAULT_ROLES:}
    manageable-org-ids: ${OAUTH2_DEFAULT_MANAGEABLE_ORG_IDS:}
    readable-org-ids: ${OAUTH2_DEFAULT_READABLE_ORG_IDS:}
  # Extra roles/orgs for identities whose userinfo claim at match-claim equals one of match-values.
  admin-grant:
    match-claim: ${OAUTH2_ADMIN_MATCH_CLAIM:}
    match-values: ${OAUTH2_ADMIN_MATCH_VALUES:}
    roles: ${OAUTH2_ADMIN_ROLES:}
    manageable-org-ids: ${OAUTH2_ADMIN_MANAGEABLE_ORG_IDS:}
    readable-org-ids: ${OAUTH2_ADMIN_READABLE_ORG_IDS:}

app:
  memory:
    # Purge of derived memory index rows (items, chunks, turn records) whose source was soft-deleted (M2b).
    # Retention depends on the recall reference count: each tier is "from this count on, keep this long";
    # ascending, first tier from 0, any number of tiers.
    decay:
      enabled: true
      interval: 1h
      half-life: 30d        # item recall score x 0.5^(days since last recall / half-life)
      inactive-after: 180d  # INFERRED items unrecalled this long become INACTIVE (never deleted)
      batch: 200
    purge:
      enabled: true
      interval: 1h
      # Recall records older than this are marked expired (never deleted) and stop counting as references.
      recall-record-ttl: 30d
      tiers:
        - from-count: 0
          keep: 1d
        - from-count: 2
          keep: 7d
        - from-count: 5
          keep: 30d
    # Memory judgement: existing items sent with each turn so corrections can UPDATE / SUPERSEDE (2026-10-30).
    # Union of the newest items of this conversation (no literal match needed) and items matching the turn's codes
    # and keywords, same scope as recall; ranked by decayed score; lowest-ranked dropped over the token cap.
    # Non-negative; existing-recent-items <= existing-max-items (checked at startup); existing-max-items 0 = none.
    judgement:
      existing-max-items: 10
      existing-recent-items: 5
      existing-max-tokens: 1500   # estimated tokens; separate from max-source-tokens, usage counts toward quota
    # Tiered compression of stored original messages (M2b Task 9). Finished turns' message payloads and tool
    # arguments/results older than compress-after (by creation) are stored zstd-compressed at warm-level and
    # recompressed at cold-level after recompress-after; identical texts >= dedupe-min-bytes are stored once per
    # tenant. Plain-text SHA-256 and the zstd frame checksum are verified on every read. decompress=true (with
    # enabled=true) writes everything back as plain text: run it before downgrading (see operations.md).
    # Recalled compressed text is cached in Redis for recall-cache-ttl. Checked at startup.
    storage:
      enabled: false
      decompress: false
      compress-after: 7d
      recompress-after: 90d   # must not be shorter than compress-after
      warm-level: 3           # zstd levels, checked against the library when enabled
      cold-level: 19
      dedupe-min-bytes: 4096
      batch: 200              # rows per job run, and conversations per scan
      interval: 10m           # scan interval of the compression job
      recall-cache-ttl: 1h
    # In-chat forget / restore ("忘记…" / "记起来…"): several matches are listed for a pick that stays open this long.
    forget:
      pending-ttl: 5m
      max-candidates: 5
      classify-timeout: 10s
  data-dir: ${APP_DATA_DIR:${user.home}/.openclaw/workspace}
  upload:
    dir: ${app.data-dir}/uploads
    ttl-hours: 24
    max-size-mb: 10
    max-files-per-request: 10
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
      - application/pdf
  knowledge:
    temp-dir: ${app.data-dir}/knowledge-pending
    lib-dir: ${app.data-dir}/lib
    max-size-mb: 5
    summary-timeout: 30s
    approval-workflow-timeout: 5m
    approval-compensation-timeout: 3m
    approval-claim-lease: 15m
    approval-claim-safety-margin: 2m
    approval-claim-release-max-attempts: 3
    approval-claim-release-retry-delay: 100ms

---
spring:
  config:
    activate:
      on-profile: dev
    import:
      - nacos:${spring.application.name}-${spring.profiles.active}.yaml?group=${spring.cloud.nacos.config.group}&refreshEnabled=true
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:agile-agent-${spring.profiles.active}}
        group: ${NACOS_GROUP:agile-agent}
debug: ${DEBUG:-false}
